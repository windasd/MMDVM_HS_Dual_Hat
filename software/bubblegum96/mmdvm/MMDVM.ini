# MMDVM-Host configuration for the r3.0-study mezzanine on a Bubblegum-96.
# Installed as /etc/MMDVM-Host.ini (upstream renamed MMDVM.ini to
# MMDVM-Host.ini and the program to MMDVM-Host; this file keeps the old name
# in the repository only).
#
# Based on MMDVM-Host.ini from g4klx/MMDVM-Host master (fetched 2026-11-16).
# All option names are from that file. UNTESTED: no hardware exists yet.
#
# PLACEHOLDERS that must be changed before first start:
#   [General] Callsign, Id        [Modem] RXFrequency, TXFrequency
#   [DMR] ColorCode
# mmdvmhost.service refuses to start while Callsign=N0CALL.
#
# There is no display section here any more: the current MMDVM-Host passes
# display data between MQTT and the modem's serial repeater port by itself
# (topics <Name>/display-in and <Name>/display-out). The TJC screen is
# configured in MMDVM-Display.ini with [Nextion] Port=modem.

[General]
# PLACEHOLDER
Callsign=N0CALL
# PLACEHOLDER: DMR ID (7 digits) or repeater ID
Id=1234567
Timeout=180
# Dual ADF7021 = duplex hotspot
Duplex=1
# ModeHang=10
RFModeHang=10
NetModeHang=3
# 0: systemd runs the program in the foreground (see mmdvmhost.service)
Daemon=0

[Log]
# Logging levels, 0=No logging
MQTTLevel=1
# DisplayLevel goes to stdout, i.e. the systemd journal
DisplayLevel=1

[MQTT]
Host=127.0.0.1
Port=1883
Auth=0
Username=mmdvm
Password=mmdvm
Keepalive=60
# MMDVM-Display.ini [MQTT] HostMQTTName must be the same string
Name=host

[CW Id]
Enable=1
Time=10
# Callsign=

[DMR Id Lookup]
File=/var/lib/mmdvm/DMRIds.dat
Time=24

[NXDN Id Lookup]
File=/var/lib/mmdvm/NXDN.csv
Time=24

[Modem]
# Valid values are "null", "uart", "udp", and (on Linux) "i2c"
Protocol=uart
# LS UART0 = S900 UART2 = ttyOWL2 (needs the serial2 alias from the DT overlay)
UARTPort=/dev/ttyOWL2
# MMDVM_HS firmware host speed (STM32_USART1_HOST)
UARTSpeed=115200

# PLACEHOLDERS (Hz). 0 is not a valid frequency: set both.
# Duplex with two ADF7021 needs RX and TX at least 5 MHz apart
# (MMDVM_HS README) and both inside the band allowed by the licence.
RXFrequency=0
TXFrequency=0

# MMDVM_HS README: TXInvert, RXInvert, PTTInvert, RXLevel, RXDCOffset and
# TXDCOffset have no effect on ADF7021 boards. Upstream defaults are kept.
TXInvert=1
RXInvert=0
PTTInvert=0
TXDelay=100
# RXOffset / TXOffset (Hz) are the calibration values that matter on an
# MMDVM_HS: adjust RXOffset in steps of 100 Hz for the lowest BER.
RXOffset=0
TXOffset=0
DMRDelay=0
RXLevel=50
# MMDVM_HS README: recommended 50
TXLevel=50
RXDCOffset=0
TXDCOffset=0
# MMDVM_HS README: recommended 100
RFLevel=100
# CWIdTXLevel=50
# D-StarTXLevel=50
# DMRTXLevel=50
# YSFTXLevel=50
# P25TXLevel=50
# NXDNTXLevel=50
# POCSAGTXLevel=50
RSSIMappingFile=/var/lib/mmdvm/RSSI.dat
UseCOSAsLockout=0
Trace=0
Debug=0

[Transparent Data]
Enable=0
RemoteAddress=127.0.0.1
RemotePort=40094
LocalPort=40095
# SendFrameType=0

# Only DMR is enabled. MMDVM_HS README, duplex boards: mode scanning makes
# DMR activation difficult, so enable one mode at a time until it works.

[D-Star]
Enable=0
Module=C
SelfOnly=0
AckReply=1
AckTime=750
AckMessage=0
ErrorReply=1
RemoteGateway=0
# ModeHang=10
WhiteList=

[DMR]
Enable=1
Beacons=0
BeaconInterval=60
BeaconDuration=3
# PLACEHOLDER
ColorCode=1
SelfOnly=0
EmbeddedLCOnly=0
DumpTAData=1
TalkerAlias=0
# Prefixes=234,235
# Slot1TGWhiteList=
# Slot2TGWhiteList=
CallHang=3
TXHang=4
# ModeHang=10
# OVCM Values, 0=off, 1=rx_on, 2=tx_on, 3=both_on, 4=force off
# OVCM=0
Protect=0

[DMR Trunking]
Enable=0
ControlChannel=0
ControlChannelAlternateSlot=0
SystemCode=0
RegistrationRequired=0

[System Fusion]
Enable=0
LowDeviation=0
SelfOnly=0
TXHang=4
RemoteGateway=0
# ModeHang=10

[P25]
Enable=0
NAC=293
SelfOnly=0
OverrideUIDCheck=0
RemoteGateway=0
SoftId=0
TXHang=5
# ModeHang=10

[NXDN]
Enable=0
RAN=1
SelfOnly=0
RemoteGateway=0
TXHang=5
# ModeHang=10

[POCSAG]
Enable=0
Frequency=439987500

# FM is not supported by the ADF7021 (MMDVM_HS) firmware.
[FM]
Enable=0

[D-Star Network]
Enable=0
LocalAddress=127.0.0.1
LocalPort=20011
GatewayAddress=127.0.0.1
GatewayPort=20010
# ModeHang=3
Debug=0

# MMDVM-Host only talks to a gateway on this host (DMRGateway). The gateway
# is not part of this package; leave Enable=0 until one is installed.
[DMR Network]
Enable=0
LocalAddress=127.0.0.1
LocalPort=62032
GatewayAddress=127.0.0.1
GatewayPort=62031
Jitter=360
Slot1=1
Slot2=1
# ModeHang=3
Debug=0

[System Fusion Network]
Enable=0
LocalAddress=127.0.0.1
LocalPort=3200
GatewayAddress=127.0.0.1
GatewayPort=4200
# ModeHang=3
Debug=0

[P25 Network]
Enable=0
LocalAddress=127.0.0.1
LocalPort=32010
GatewayAddress=127.0.0.1
GatewayPort=42020
# ModeHang=3
Debug=0

[NXDN Network]
Enable=0
Protocol=Icom
LocalAddress=127.0.0.1
LocalPort=14021
GatewayAddress=127.0.0.1
GatewayPort=14020
# ModeHang=3
Debug=0

[POCSAG Network]
Enable=0
LocalAddress=127.0.0.1
LocalPort=3800
GatewayAddress=127.0.0.1
GatewayPort=4800
# ModeHang=3
Debug=0

[FM Network]
Enable=0

[Lock File]
Enable=0
File=/tmp/MMDVM_Active.lck

[Remote Control]
Enable=0
