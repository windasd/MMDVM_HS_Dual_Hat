# MMDVM-Display configuration: TJC8048X550_011R on the MMDVM_HS serial
# repeater port (STM32 USART2 -> J5), reached through MMDVM-Host and MQTT.
# Installed as /etc/MMDVM-Display.ini.
#
# Based on MMDVM-Display.ini from g4klx/MMDVM-Display master (fetched
# 2026-11-16); only the sections used here are kept. UNTESTED.
#
# Known open points (study section 6.3):
#  - There is no ready-made 800x480 TJC screen file; ScreenLayout only selects
#    which field set MMDVM-Display sends. The .tft has to be made with the TJC
#    editor to match the chosen layout.
#  - The firmware repeater port runs at SERIAL_REPEATER_BAUD (9600 in the
#    stock MMDVM_HS_Dual_Hat config). The screen's "bauds=" must match it.
#  - MMDVM-Display takes some values (IP address, temperature ...) from the
#    separate MMDVM-Info program (InfoMQTTName). That program is not part of
#    this package.

[General]
# Valid values are Dummy, HD44780, LCDproc, Nextion, OLED, TFTSurenoo
Display=Nextion
TemperatureInF=0
# 0: systemd runs the program in the foreground
Daemon=0

[Log]
# Logging levels, 0=No logging
MQTTLevel=1
DisplayLevel=1

[MQTT]
Host=127.0.0.1
Port=1883
Keepalive=60
Auth=0
Username=mmdvm
Password=mmdvm
Name=display
# Must equal [MQTT] Name in /etc/MMDVM-Host.ini
HostMQTTName=host
InfoMQTTName=info
HostConfName=MMDVM-Host

[Nextion]
# "modem" = send through MMDVM-Host to the modem's serial repeater port
Port=modem
# Speed is only used for physically attached screens
Speed=9600
Brightness=50
DisplayClock=1
UTC=0
# Screen Layout: 0=G4KLX 2=ON7LDS 3=ON7LDS DIY
ScreenLayout=2
IdleBrightness=20
