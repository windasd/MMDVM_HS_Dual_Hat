# Pinned upstream sources for install-pistar.sh. Sourced by bash.
#
# Nothing of these repositories is stored in this repository; the installer
# clones each one on the target and refuses to continue if the checkout is not
# at exactly the commit named here.
#
# How the pins were chosen (2026-11-16), see RESEARCH.md section 2:
#
#  - Pi-Star repositories: HEAD of master on 2026-11-16. The dashboard and the
#    sbin scripts are developed together (the sudoers allowlist in
#    pistar-upgrade is written against the dashboard of the same day), so they
#    are pinned as a pair.
#  - g4klx radio software: the commit whose 40-digit id is embedded in the
#    armhf binary that Pi-Star 4.3 ships in Pi-Star_v43_Binaries_Bin at
#    PIN_BIN ("Built ... (GitID #...)" string). Each id was looked up in the
#    g4klx repository and is on its master (M17Gateway: main) branch.
#  - Repositories whose Pi-Star binary carries no commit id: the newest
#    upstream commit that is not newer than the commit that last updated the
#    binary in Pi-Star_v43_Binaries_Bin, and that is still the pre-MQTT code.
#    These four are an inference, not an identification.

# --- Pi-Star (no licence stated on GitHub: fetched, never redistributed) ----
URL_DASH=https://github.com/AndyTaylorTweet/Pi-Star_DV_Dash.git
PIN_DASH=ca50804e0bfebd19848baaa17609e503992e8b5e   # 2026-10-22, dashboard version 20261008
URL_SBIN=https://github.com/AndyTaylorTweet/Pi-Star_Binaries_sbin.git
PIN_SBIN=3c736123b2b789595047fe5c6536c0e4fa9cc20c   # 2026-10-22, latest release arm = 4.3.10
URL_BIN=https://github.com/AndyTaylorTweet/Pi-Star_v43_Binaries_Bin.git
PIN_BIN=f851131d88002d9fe10b96343f06cf7ecc987df5    # 2025-09-25; only config_clean.zip and firmware/ are used

# Version written to /etc/pistar-release: the last release arm of
# pistar-upgrade at PIN_SBIN, and the lower bound the dashboard's upgrade
# banner accepts (config/banner_warnings.inc at PIN_DASH).
PISTAR_VERSION=4.3.10

# --- g4klx radio software, commit id embedded in the Pi-Star 4.3 binary -----
URL_MMDVMHOST=https://github.com/g4klx/MMDVM-Host.git   # formerly g4klx/MMDVMHost
PIN_MMDVMHOST=05b10ac544b0e19a7e9827653fd0709648b7aa73  # 2025-09-25, Version.h 20250828 (Pi-Star binary reports 20250925_PS4)
URL_DMRGATEWAY=https://github.com/g4klx/DMRGateway.git
PIN_DMRGATEWAY=ec5c32b57af0eecd4ec7c3bb6a2cea6e066bdc0f # 2025-03-15 (binary 20250318_PS4)
URL_YSFCLIENTS=https://github.com/g4klx/YSFClients.git
PIN_YSFCLIENTS=598854b2e3c535c4d89702841e6a01d85e9e97ce # 2025-06-15, id in YSFGateway (20250616_PS4); YSFParrot and DGIdGateway binaries carry 75c8450 (2025-05-21), an ancestor
URL_P25CLIENTS=https://github.com/g4klx/P25Clients.git
PIN_P25CLIENTS=298b9b4da3df61115632a00f58ab4edcb92a7997 # 2025-04-04 (20250405_PS4)
