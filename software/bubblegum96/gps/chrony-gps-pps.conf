# /etc/chrony/conf.d/mmdvm-gps-pps.conf - GPS time for chrony. UNTESTED.
#
# Coarse time: gpsd publishes NMEA time in shared-memory segment 0.
# "noselect": never used on its own, it only numbers the PPS seconds.
# TODO(calibrate): "offset" is the delay of the NMEA sentence after the second
# (9600 baud through the I2C UART bridge); 0.2 s is a guess. Compare against
# network time with "chronyc sourcestats" and adjust. The PPS lock only works
# if the corrected NMEA time is within about 0.4 s of true time.
refclock SHM 0 refid NMEA offset 0.2 delay 0.2 noselect

# Precise time: kernel PPS source from the pps-gpio node (GPIO-H).
# /dev/pps0 assumes it is the only PPS source in the system
# (check: cat /sys/class/pps/pps0/name).
refclock PPS /dev/pps0 lock NMEA refid PPS

# Ubuntu's stock /etc/chrony/chrony.conf already has "makestep 1 3", which is
# what a host without a battery-backed clock (study section 3.3) needs.
